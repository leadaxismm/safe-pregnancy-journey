# Preview / review deployment. NOT for clinical use.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_APP_ENV = "preview"
  VITE_ENABLE_DEMO_DASHBOARD = "true"
  # Public values (they ship in the browser bundle). Access is enforced by Supabase RLS + server-side checks.
  VITE_SUPABASE_URL = "https://adjmenhyvrzsrudgnxda.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_fjTR0BCSKv7Hklz5hEa7tQ_K-cPFS1P"
  VITE_PUBLIC_URL = "https://spj-review-preview.netlify.app/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# the service worker and HTML must always be revalidated so content updates reach users
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
